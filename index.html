<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Цифровой консьерж «Домовой»</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 420px; height: 720px; background-color: #fff; border-radius: 25px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); overflow: hidden; display: flex; flex-direction: column; }
        .chat-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .chat-header h2 { margin: 0; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; font-size: 15px; }
        .user-message { background-color: #e7f3ff; align-self: flex-end; border-bottom-right-radius: 5px; }
        .bot-message { background-color: #f1f1f1; align-self: flex-start; border-bottom-left-radius: 5px; }
        .chat-input { display: flex; padding: 15px; border-top: 1px solid #ddd; background-color: #f7f7f7; }
        #userInput { flex-grow: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        #userInput:focus { border-color: #667eea; }
        #sendBtn { background-color: #667eea; color: white; border: none; border-radius: 20px; padding: 0 20px; margin-left: 10px; cursor: pointer; transition: background 0.2s; }
        #sendBtn:hover { background-color: #5a6fd8; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .resource-option, .vote-option { margin: 10px 0; }
        #confirmBooking, #confirmVote { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🧹 Домовой</h2>
            <p>Ваш цифровой консьерж</p>
        </div>
        <div class="chat-messages" id="chatBox">
            <div class="message bot-message">👋 Привет! Я Домовой. Напишите «Забронировать», «Голосование», «Доска», «Заявка» или «Квитанция».</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Напишите сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>

    <!-- Модальное окно бронирования -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Бронирование ресурсов</h3>
            <div class="resource-option"><label><input type="radio" name="resourceType" value="washer" checked> Стиральная машина</label></div>
            <div class="resource-option"><label><input type="radio" name="resourceType" value="parking"> Парковочное место (Г-12)</label></div>
            <div class="resource-option"><label><input type="radio" name="resourceType" value="bbq"> Мангальная зона</label></div>
            <button id="confirmBooking">Забронировать 19:00 - 20:30</button>
        </div>
    </div>

    <!-- Модальное окно голосования -->
    <div id="voteModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Создать голосование</h3>
            <input type="text" id="voteTopic" placeholder="Тема (например: Установка шлагбаума)" style="width:100%; padding:10px; margin-bottom:10px;">
            <div class="vote-option"><label><input type="radio" name="voteType" value="yesno" checked> Да / Нет</label></div>
            <div class="vote-option"><label><input type="radio" name="voteType" value="multiple"> Выбор одного из списка</label></div>
            <button id="confirmVote">Опубликовать</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const bookingModal = document.getElementById('bookingModal');
        const voteModal = document.getElementById('voteModal');
        const closeModal = document.querySelector('.close');
        const confirmBookingBtn = document.getElementById('confirmBooking');
        const confirmVoteBtn = document.getElementById('confirmVote');

        // --- ИМИТАЦИЯ БАЗЫ ДАННЫХ ---
        const db = {
            bookings: [],
            claims: [],
            karma: 0,
            votes: [],
            ads: [],
            bills: [
                { id: 1, month: 'Октябрь 2026', amount: 4520.50, status: 'paid', date: '15.11.2026' },
                { id: 2, month: 'Ноябрь 2026', amount: 4890.00, status: 'due', date: '01.12.2026' }
            ]
        };

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message');
            div.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- ФУНКЦИИ БОТА ---
        function handleBooking() {
            addMessage('📅 Что вы хотите забронировать?', 'bot');
            bookingModal.style.display = 'flex';
        }

        function handleVote() {
            addMessage('🗳️ Создание опроса для жильцов.', 'bot');
            voteModal.style.display = 'flex';
        }

        function handleBoard() {
            if (db.ads.length === 0) {
                addMessage('📌 Доска объявлений пуста.', 'bot');
            } else {
                addMessage('📌 Последние объявления:', 'bot');
                db.ads.forEach(ad => {
                    const adDiv = document.createElement('div');
                    adDiv.className = 'ad-card';
                    adDiv.innerHTML = `<strong>${ad.title}</strong><br><small>${ad.author} | ${ad.time}</small><br>${ad.text}`;
                    chatBox.appendChild(adDiv);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
            addMessage('Чтобы добавить: "Продам велосипед Stels, 3000р, +79991234567"', 'bot');
        }

        function handleAddAd(text) {
            const parts = text.split(',');
            if (parts.length >= 3) {
                const ad = {
                    title: parts[0].replace('Продам', '').trim(),
                    price: parts[1].trim(),
                    phone: parts[2].trim(),
                    author: 'Вы',
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                };
                db.ads.push(ad);
                addMessage('✅ Объявление размещено на доске.', 'bot');
            } else {
                addMessage('❗ Не удалось распознать формат. Пример: Продам стол, 1000р, +7900...', 'bot');
            }
        }

        function handleInvoices() {
            const bill = db.bills.find(b => b.status === 'due');
            if (bill) {
                const billDiv = document.createElement('div');
                billDiv.className = 'bill-card';
                billDiv.innerHTML = `
                    <div class="bill-header">
                        <span>Квитанция за ${bill.month}</span>
                        <span style="color:#888;">${bill.date}</span>
                    </div>
                    <div>К оплате: <span class="bill-amount">${bill.amount.toLocaleString('ru-RU')} ₽</span></div>
                    <button class="btn-pay" onclick="openPayModal(${bill.amount}, ${bill.id})">Оплатить</button>
                `;
                chatBox.appendChild(billDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                addMessage('🟢 У вас нет неоплаченных квитанций.', 'bot');
            }
            const oldBills = db.bills.filter(b => b.status === 'paid');
            if (oldBills.length > 0) {
                addMessage('📜 История платежей:', 'bot');
                oldBills.forEach(b => {
                    addMessage(`${b.month}: ${b.amount.toLocaleString('ru-RU')} ₽ (Оплачено ${b.date})`, 'bot');
                });
            }
        }

        function handleClaim() {
            addMessage('🛠️ Создаю заявку. Напишите суть проблемы.', 'bot');
        }

        function handleClaimStatus() {
            if (db.claims.length === 0) {
                addMessage('У вас нет активных заявок.', 'bot');
            } else {
                db.claims.forEach((claim, index) => {
                    addMessage(`📋 Заявка №${index + 1}: ${claim.text}`, 'bot');
                    addMessage(`Статус: ${claim.status}`, 'bot');
                });
            }
        }

        // --- ОБРАБОТЧИКИ СОБЫТИЙ ---
        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) {
                processUserMessage(text);
                userInput.value = '';
            }
        });
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        closeModal.onclick = () => { bookingModal.style.display = 'none'; voteModal.style.display = 'none'; };
        window.onclick = (e) => { if (e.target === bookingModal || e.target === voteModal) { bookingModal.style.display = 'none'; voteModal.style.display = 'none'; } };

        confirmBookingBtn.addEventListener('click', () => {
            const type = document.querySelector('input[name="resourceType"]:checked').value;
            const isBooked = db.bookings.find(b => b.type === type && b.time === '19:00');
            if (isBooked) {
                addMessage('❌ Это место уже занято в 19:00.', 'bot');
            } else {
                db.bookings.push({ type: type, time: '19:00' });
                const names = { washer: 'Стиральная машина', parking: 'Парковка Г-12', bbq: 'Мангальная зона' };
                addMessage(`🎉 Успех! ${names[type]} забронирована на 19:00.`, 'bot');
            }
            bookingModal.style.display = 'none';
        });

        confirmVoteBtn.addEventListener('click', () => {
            const topic = document.getElementById('voteTopic').value;
            if (!topic) { addMessage('❗ Введите тему опроса.', 'bot'); return; }
            const vote = { topic: topic, votes: {}, status: 'active' };
            db.votes.push(vote);
            addMessage(`🗳️ Голосование «${topic}» запущено!`, 'bot');
            voteModal.style.display = 'none';
        });

        // --- ОСНОВНОЙ ДИСПЕТЧЕР ---
        function processUserMessage(text) {
            const lower = text.toLowerCase();
            if (lower.includes('забронировать') || lower.includes('стир') || lower.includes('парк') || lower.includes('мангал')) {
                handleBooking();
            } else if (lower.includes('голос') || lower.includes('опрос')) {
                handleVote();
            } else if (lower.includes('доск') || lower.includes('объявлен')) {
                handleBoard();
            } else if (lower.startsWith('продам') || lower.startsWith('отдам')) {
                handleAddAd(text);
            } else if (lower.includes('квитанц') || lower.includes('жкх') || lower.includes('платеж')) {
                handleInvoices();
            } else if (lower.includes('статус') || lower.includes('где заявка')) {
                handleClaimStatus();
            } else if (lower.includes('заявк') || lower.includes('капает')) {
                const claim = { text: text, status: 'Принята в работу', id: db.claims.length + 1 };
                db.claims.push(claim);
                addMessage(`✉️ Заявка №${claim.id} создана. Статус: ${claim.status}`, 'bot');
            } else if (lower.includes('привет') || lower.includes('здорово')) {
                addMessage('И вам не хворать! Чем помочь по дому?', 'bot');
            } else {
                addMessage('Я вас понял. Основные разделы: "Забронировать", "Голосование", "Доска", "Заявка", "Квитанция".', 'bot');
            }
        }
    </script>
</body>
</html>
